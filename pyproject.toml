[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wmshare"
version = "1.7.3"
description = "A 股个股数据 Python SDK：随包内置机器可读数据目录 + 云端取数客户端（非商业免费，注册开放平台即得凭证）"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "wmshare contributors" }]
keywords = [
    "A股", "stock", "finance", "financial-data", "quant",
    "dividend", "kline", "financial-statements", "screener",
    "sdk", "china-stock", "pandas", "market-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=5",
    "jsonschema>=4",
    "mypy>=1.8",
]
dataframe = ["pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/open-winmale/wmshare"
Documentation = "https://github.com/open-winmale/wmshare/blob/main/docs/API.md"
Issues = "https://github.com/open-winmale/wmshare/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wmshare = [
    "py.typed",
    "_catalog/schema/*.json",
    "_catalog/domains/*.yaml",
    "_catalog/generated/*.json",
    "_catalog/symbols/*.json",
    "skills/wmshare/*.md",
]

[tool.mypy]
files = ["src/wmshare"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["wmshare"]
# 生成层是逐函数委托 call() 的样板代码；其正确性由合同测试（签名/参数一致性）
# 与 client.call 的测试覆盖，不重复计入行覆盖率分母。
omit = ["*/api/_generated.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
