id: corp.equity
version: 1.1.0
cn: 股本与股东
kind: raw
category: reference
priority: P1
description: 股本变动、公司档案（行业/上市日/股本/简介）与 F10 深度数据体系（十大股东/
  一致行动人/股权质押/解禁限售/持股人数/回购/机构持仓/高管员工/盈利预测/研报/融资融券等）。
  披露原值直采。
data_origin: [交易所披露, 平台数据服务]
units:
  shares: 股（股本序列）
  pct: 百分数（占比列）
requires: {path: '', preloaded: true}
stores: [biz.equity, ref.info]
notes:
  - 本域当前无独立 L0 函数面：公司档案经 cli.info.profile() 与 fund.indicators 的
    profile 指标组（$NAME/$INDUSTRY_CUR/$ORG_ORGTYPE/$ORG_LISTINGDATE）获取
  - 'F10 深度页（十大股东/质押/解禁/回购/机构持仓/高管/盈利预测等约 67 个分析页）暂未进 SDK，按需晋升'
  - 股东户数/质押比例等派生比率为计算值，读取时以字段名 pct/_rate 区分
functions: []
