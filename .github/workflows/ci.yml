name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Leak gate (internal markers / secrets)
        run: python tools/check_leak.py
      - name: Catalog contract + anti-fabrication gate
        run: python tools/validate_catalog.py
      - name: API docs drift gate
        run: python tools/gen_api_docs.py --check
      - name: Typed facade drift gate
        run: python tools/gen_typed_api.py --check
      - name: OpenAPI spec drift gate
        run: python tools/gen_openapi.py --check
      - name: Type check
        run: python -m mypy
      - name: Tests + coverage (offline; extractor drift auto-skips without scripts tree)
        run: pytest -q --cov=finpipe --cov-report=term-missing --cov-fail-under=85
      - name: Wheel build + clean install smoke (3.11 only)
        if: matrix.python == '3.11'
        run: |
          python -m pip wheel . --no-deps -w /tmp/finpipe-wheel
          python -m venv /tmp/finpipe-venv
          /tmp/finpipe-venv/bin/pip install /tmp/finpipe-wheel/*.whl
          /tmp/finpipe-venv/bin/python -c "import finpipe; c=finpipe.load(); assert c.stats()['functions'] == 249"
          /tmp/finpipe-venv/bin/python examples/catalog_tour.py > /tmp/catalog_tour.out
          grep -q "数据域：16" /tmp/catalog_tour.out
