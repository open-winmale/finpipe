id: fund.segments
version: 1.0.1
cn: 经营分部
kind: raw
category: fundamentals
priority: P1
description: 主营构成的多维分解——分产品 / 分业务 / 分区域（境内外）/ 主营标签占比，
  外加合并快照与披露覆盖度。数据来自定期报告分部披露与平台清洗归一（clean 口径），
  可选 raw 直采明细。收入构成见分部明细，指标层 revenue_mix 组为其指标化引用。
data_origin: [定期报告披露, 平台清洗归一]
units:
  money: 元（分部收入 tr / 成本 cost 原币口径，实测元；tr_text 为披露展示串如「2334.83亿」）
  ratio: 小数（占比 ratio/pct、毛利率 margin、同比 yoy；0.332 = 33.2%）
requires: {path: sys/segments/init.xs, preloaded: false}
notes:
  - 'opts = {source: clean|raw, limit: 截断条数}；clean 为平台清洗归一口径，raw 为披露明细'
  - '行结构 {name, tr, tr_text, cost, margin, ratio}；margin = (tr - cost) / tr（小数），
    cost 缺失时为 nil；ratio 仅 income 维填充占比、其余维为 0 占位'
  - 'query_region 双形态：opts.source=clean（默认）返回 MAP {domestic, overseas, report_sas}，
    source=raw 返回披露明细 ARR；无数据时返回 nil'
  - 各维可用报告期不同（coverage/list_sas 可查）；products 维在部分公司为空
  - 脚本原生输出即基础单位（元/小数），SDK 不做换算，仅做量级守护
functions:
  - name: segments.query_products
    cn: 产品/商品分部
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true, desc: 6 位裸码}
      - {name: opts, type: object, required: false, desc: '{source: clean|raw, limit: 条数}'}
    returns:
      desc: ARR · 分部行（名称/收入/成本/毛利率）
      shape:
        kind: array
        items:
          kind: object
          cn: 分部行
          fields:
            - {name: name, type: string, cn: 分部名称}
            - {name: tr, type: float64, cn: 收入（元）}
            - {name: tr_text, type: string, cn: 收入展示串}
            - {name: cost, type: float64, cn: 成本（元）, optional: true}
            - {name: margin, type: float64, cn: 毛利率（小数）, optional: true}
            - {name: ratio, type: float64, cn: 占比占位（income 维才有值）, optional: true}
    example: 'segments.query_products("000333", {})'
    ranges: {tr: [-1.0e+13, 1.0e+13], cost: [0, 1.0e+13], margin: [-5, 1], ratio: [0, 1]}
  - name: segments.query_business
    cn: 业务线分部
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
      - {name: opts, type: object, required: false, desc: 同 query_products}
    returns:
      desc: ARR · 分部行（结构同 query_products）
      shape:
        kind: array
        items:
          kind: object
          cn: 分部行
          fields:
            - {name: name, type: string, cn: 分部名称}
            - {name: tr, type: float64, cn: 收入（元）, optional: true}
            - {name: tr_text, type: string, cn: 收入展示串, optional: true}
            - {name: cost, type: float64, cn: 成本（元）, optional: true}
            - {name: margin, type: float64, cn: 毛利率（小数）, optional: true}
            - {name: ratio, type: float64, cn: 占比（小数，income 维填充）, optional: true}

    example: 'segments.query_business("600519", {})'
    ranges: {tr: [-1.0e+13, 1.0e+13], cost: [0, 1.0e+13], margin: [-5, 1], ratio: [0, 1]}
  - name: segments.query_income
    cn: 主营标签占比
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
      - {name: opts, type: object, required: false, desc: '{limit: 条数}（source 不适用，固定标签口径）'}
    returns:
      desc: ARR · 分部行（name + ratio 占比，小数；tr/cost 恒 0，margin 为 nil）
      shape:
        kind: array
        items:
          kind: object
          cn: 分部行
          fields:
            - {name: name, type: string, cn: 分部名称}
            - {name: tr, type: float64, cn: 收入（元）, optional: true}
            - {name: tr_text, type: string, cn: 收入展示串, optional: true}
            - {name: cost, type: float64, cn: 成本（元）, optional: true}
            - {name: margin, type: float64, cn: 毛利率（小数）, optional: true}
            - {name: ratio, type: float64, cn: 占比（小数，income 维填充）, optional: true}

    example: 'segments.query_income("600519", {})'
    ranges: {ratio: [0, 1]}
  - name: segments.query_region
    cn: 地区/境内外分部
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
      - {name: opts, type: object, required: false, desc: '{source: clean|raw, limit: 条数}'}
    returns:
      desc: MAP · clean 口径 {domestic, overseas, report_sas}（境内/外 各含 tr/pct/margin/yoy）；
        raw 返回 ARR 明细；无数据 nil
      shape:
        kind: object
        cn: 境内外分部
        fields:
          - {name: source, type: string, cn: 口径标识}
          - {name: report_sas, type: string, cn: 报告期}
          - {name: domestic, type: object, cn: '境内 {tr, pct, margin, yoy}'}
          - {name: overseas, type: object, cn: '境外 {tr, pct, margin, yoy}'}
    example: 'segments.query_region("600519", {})'
    ranges: {tr: [-1.0e+13, 1.0e+13], pct: [0, 1], margin: [-5, 1], yoy: [-1, 100]}
  - name: segments.snapshot
    cn: 经营分部截面快照
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
      - {name: opts, type: object, required: false, desc: 同 query_products}
    returns: {desc: 'MAP · 快照 {overview, income, region, product, business, coverage}'}
    example: 'segments.snapshot("600519", {})'
    ranges: {tr: [-1.0e+13, 1.0e+13], cost: [0, 1.0e+13], margin: [-5, 1], ratio: [0, 1], pct: [0, 1], yoy: [-1, 100]}
  - name: segments.coverage
    cn: 分部披露覆盖度
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
    returns: {desc: 'MAP · 各维是否有数据（has_income/has_region/has_products/has_business）'}
    example: 'segments.coverage("600519")'
  - name: segments.list_sas
    cn: 可用报告期
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
    returns: {desc: 'MAP · {clean_last, clean_last_q4} 清洗口径锚点报告期'}
    example: 'segments.list_sas("600519")'
  # ---- L1：规范化工具 ----
  - name: segments.fmt_maps
    cn: 分部行规范化
    kind: raw
    layer: L1
    params:
      - {name: rows, type: array, required: true, desc: 分部行列表}
    returns:
      desc: ARR · 规范化分部行
      shape:
        kind: array
        items:
          kind: object
          cn: 分部行
          fields:
            - {name: name, type: string, cn: 分部名称}
            - {name: tr, type: float64, cn: 收入（元）, optional: true}
            - {name: tr_text, type: string, cn: 收入展示串, optional: true}
            - {name: cost, type: float64, cn: 成本（元）, optional: true}
            - {name: margin, type: float64, cn: 毛利率（小数）, optional: true}
            - {name: ratio, type: float64, cn: 占比（小数，income 维填充）, optional: true}

    example: 'segments.fmt_maps(rows)'
  - name: segments.fmt_item
    cn: 单条分部规范化
    kind: raw
    layer: L1
    params:
      - {name: row, type: object, required: true}
    returns:
      desc: MAP · 规范化分部行
      shape:
        kind: object
        cn: 分部行
        fields:
          - {name: name, type: string, cn: 分部名称}
          - {name: tr, type: float64, cn: 收入（元）}
          - {name: tr_text, type: string, cn: 收入展示串}
          - {name: cost, type: float64, cn: 成本（元）}
          - {name: margin, type: float64, cn: 毛利率（小数）, optional: true}
          - {name: ratio, type: float64, cn: 占比（小数）}

    example: 'segments.fmt_item(row)'
    status: internal
