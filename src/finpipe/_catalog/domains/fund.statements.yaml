id: fund.statements
version: 1.1.2
cn: 财务报表
kind: raw
category: fundamentals
priority: P0
description: 三大报表科目原值（资产负债 / 利润 / 现金流）多期透视、合并 vs 母公司比较、
  报表目录树与审计意见。科目为披露原值；树视图中的派生比率行（__ 前缀 / pct 行）另注。
  外部源主要指标（源端算好直采）亦归本域。
data_origin: [定期报告披露原值, 外部数据服务(主要指标)]
units:
  amount: 报表原币（CN=元，HK=港币，US=美元）
  period: 报告期（年-采样，如 2024-Q4 / 2024 年报）
requires: {path: sys/rptdom/init.xs, preloaded: false}
stores: [fin.balance, fin.income, fin.cashflow, fin.indicator]
notes:
  - domain 取值 fin.balance_sheet / fin.income_statement / fin.cashflow_statement
  - opts.scope = 合并(默认) | 母公司；opts.n 期数（默认 5，年报降序）；opts.years 年份数组（如 [2024,2023]）
  - 新旧会计准则口径适配在平台内部层完成，本域输出已归一
functions:
  - name: rptdom.statement
    cn: 三报表科目×期次透视
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true, desc: 6 位裸码}
      - {name: domain, type: string, required: true, enum: [fin.balance_sheet, fin.income_statement, fin.cashflow_statement]}
      - {name: opts, type: object, required: false, desc: '{scope: 合并|母公司(默认合并), n: 期数(默认5), years: 年份数组}'}
    returns: {desc: ARR · 科目行（科目代码/中文名×期次列）}
    example: 'rptdom.statement("600519", "fin.income_statement", {"scope": "合并", "n": 5})'
  - name: rptdom.statement_years
    cn: 报表可用年报（Q4 档，降序）
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
      - {name: domain, type: string, required: true, enum: [fin.balance_sheet, fin.income_statement, fin.cashflow_statement]}
    returns: {desc: ARR · 年份}
    example: 'rptdom.statement_years("600519", "fin.income_statement")'
  - name: rptdom.statement_compare
    cn: 合并 vs 母公司报表比较
    kind: computed
    layer: L0
    params:
      - {name: sym, type: string, required: true}
      - {name: domain, type: string, required: true}
      - {name: opts, type: object, required: false, desc: 同 statement（差额/差额占比%为派生计算）}
    returns: {desc: 'ARR · 科目行 + 合并/母公司/差额/差额占比'}
    example: 'rptdom.statement_compare("600519", "fin.income_statement", {"n": 2})'
    notes: ['差额占比 = 差额 / 合并值（百分数）；母公司未披露的科目差额为空']
  - name: rptdom.statement_tree
    cn: 三表目录树视图（树序 + 比率/占比行）
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
      - {name: domain, type: string, required: true}
      - {name: opts, type: object, required: false, desc: 同 statement}
    returns: {desc: ARR · 树序科目行；含派生比率行（LD/IBD_RATE/GM 等 pct 行）}
    example: 'rptdom.statement_tree("600519", "fin.balance_sheet", {"scope": "合并", "n": 5})'
    notes: ['主体为披露原值科目；drv 派生行（比率/合计）为计算值，行内可辨']
  - name: rptdom.statement_audit
    cn: 审计意见（Q4 年轴）
    kind: raw
    layer: L0
    params:
      - {name: sym, type: string, required: true}
    returns: {desc: 'MAP · {年份: 审计意见}'}
    example: 'rptdom.statement_audit("600519")'
