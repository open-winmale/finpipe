[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finpipe"
version = "0.1.0"
description = "A 股个股数据 Python SDK：随包内置机器可读数据目录 + 云端取数客户端（仅依赖 appid）"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "jsonschema>=4",
    "mypy>=1.8",
]
dataframe = ["pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/open-winmale/finpipe"
Documentation = "https://github.com/open-winmale/finpipe/blob/main/docs/API.md"
Issues = "https://github.com/open-winmale/finpipe/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finpipe = [
    "py.typed",
    "_catalog/schema/*.json",
    "_catalog/domains/*.yaml",
    "_catalog/generated/*.json",
]

[tool.mypy]
files = ["src/finpipe"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
